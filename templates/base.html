<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Review</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0;
           background: #f5f5f7; color: #1c1c1e; }
    nav { background: #1c1c1e; color: #fff; padding: 12px 20px;
          display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    nav a { color: #d1d1d6; text-decoration: none; font-size: 15px; }
    nav a:hover, nav .brand { color: #fff; }
    nav .brand { font-weight: 700; font-size: 17px; margin-right: auto; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; margin-top: 28px; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    .card { background: #fff; border-radius: 10px; padding: 14px 18px;
            flex: 1; min-width: 140px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card .num { font-size: 26px; font-weight: 700; }
    .card .lbl { font-size: 13px; color: #6e6e73; }
    table { width: 100%; border-collapse: collapse; background: #fff;
            border-radius: 10px; overflow: hidden; font-size: 14px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e5ea; }
    th { background: #f2f2f7; font-size: 13px; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 600; }
    .pass { background: #e5f6ed; color: #1a7f37; }
    .flagged { background: #fde8e8; color: #c0392b; }
    .sev-low { color: #6e6e73; } .sev-medium { color: #b8860b; }
    .sev-high { color: #d35400; } .sev-critical { color: #c0392b; font-weight: 700; }
    .btn { display: inline-block; background: #0071e3; color: #fff;
           padding: 9px 18px; border-radius: 8px; text-decoration: none;
           border: 0; font-size: 14px; cursor: pointer; }
    .btn.secondary { background: #e5e5ea; color: #1c1c1e; }
    .flash { background: #fff3cd; border: 1px solid #ffe69c; color: #664d03;
             padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
    pre.feedback { background: #fff; padding: 14px; border-radius: 10px;
                   white-space: pre-wrap; font-size: 13px; overflow-x: auto;
                   box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .issue { border-left: 3px solid #d35400; background: #fff; padding: 8px 12px;
             margin: 6px 0; border-radius: 0 8px 8px 0; font-size: 13px; }
    .issue .res { color: #1a7f37; }
    .esc { background: #fff; border-left: 4px solid #c0392b; padding: 12px 14px;
           margin: 8px 0; border-radius: 0 8px 8px 0; font-size: 14px; }
    form.panel, .panel { background: #fff; padding: 18px; border-radius: 10px;
           box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
    input[type=text], select, textarea { padding: 9px; border-radius: 8px;
           border: 1px solid #c7c7cc; font-size: 14px; width: 100%;
           max-width: 420px; margin: 4px 0 12px; }
    textarea { min-height: 130px; font-family: monospace; }
    .filters a { margin-right: 10px; font-size: 13px; }
    .muted { color: #6e6e73; font-size: 13px; }
    details summary { cursor: pointer; color: #0071e3; font-size: 13px; margin: 8px 0; }
    .ai-verdict { font-size: 13px; padding: 6px 10px; margin: 4px 0;
                  border-radius: 6px; }
    .ai-confirmed { background: #fde8e8; color: #c0392b; }
    .ai-dismissed { background: #e5f6ed; color: #1a7f37; }
    .ai-unclear { background: #fff3cd; color: #664d03; }
    .fix-panel { background: #fff; border: 1px solid #e5e5ea;
                 border-radius: 12px; padding: 14px 18px; margin: 16px 0; }
    .fix-panel form label { display: inline-block; margin-right: 14px; }
  </style>
</head>
<body>
<nav>
  <span class="brand">QA Review</span>
  <a href="/">Dashboard</a>
  <a href="/upload">Upload dataset</a>
  {% if user %}
  <a href="/logout">Log out ({{ user.username }})</a>
  {% endif %}
</nav>
<main>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
